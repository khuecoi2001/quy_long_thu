<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quỹ Lông thủ</title>
<meta name="description" content="Quản lý quỹ CLB cầu lông Lông thủ NSMO">
<meta name="theme-color" content="#F1F4F0">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quỹ Lông thủ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: phone app shell. Sticky header, one scrolling view, fixed tab bar with a raised
   centre action; sheets rise from the bottom, the 3-step "Thêm buổi" flow covers the screen. */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface-2:#E9EEE8; --line:#DCE3DA;
  --fg:#111C16; --fg-2:#34443B; --muted:#5F6E66;
  --accent:#0B7A4B; --accent-strong:#075F3A; --accent-ink:#FFFFFF; --accent-soft:#DCEFE3;
  --hero:#0A4A31; --hero-2:#0D6040; --hero-ink:#F0FAF4; --hero-muted:#A6D4BB; --shuttle:#D8EF5C;
  --debt:#B53A10; --debt-soft:#FBE8DF; --pos:#0B7A4B; --pos-soft:#DCEFE3;
  --scrim:rgba(8,20,14,.45); --shadow:0 1px 2px rgba(14,32,22,.05),0 10px 30px rgba(14,32,22,.08);
  --focus:#1D6FD1;
  --av1b:#DCEFE3;--av1f:#0A6640; --av2b:#DDE8F8;--av2f:#1D58A8; --av3b:#F8E9C6;--av3f:#815300;
  --av4b:#F8DCE4;--av4f:#9C2449; --av5b:#E7E0F8;--av5f:#56389F; --av6b:#D5EEEE;--av6f:#0C6464;
  --av7b:#FBE1CF;--av7f:#9C4410; --av8b:#E2E7ED;--av8f:#3A4C60;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-xl:24px; --r-lg:18px; --r-md:14px; --r-sm:10px;
  --tabbar:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A100D; --surface:#121A16; --surface-2:#19231E; --line:#24302A;
  --fg:#E6EFE9; --fg-2:#C1CEC6; --muted:#8E9F95;
  --accent:#3DCB8B; --accent-strong:#62DAA3; --accent-ink:#03170D; --accent-soft:#113726;
  --hero:#0E3826; --hero-2:#124631; --hero-ink:#EEFAF2; --hero-muted:#98CBAE; --shuttle:#D8EF5C;
  --debt:#FF8D63; --debt-soft:#3A1D12; --pos:#4ED69A; --pos-soft:#113726;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 0 rgba(255,255,255,.03);
  --focus:#7FB4FF;
  --av1b:#153826;--av1f:#8FE2B7; --av2b:#172E4C;--av2f:#9EC4F4; --av3b:#3A2D0F;--av3f:#F1CD78;
  --av4b:#3D1924;--av4f:#F4A2B9; --av5b:#2A2246;--av5f:#C4B4F4; --av6b:#113434;--av6f:#88DCDC;
  --av7b:#3C2313;--av7f:#F5B389; --av8b:#232E3A;--av8f:#B7C5D5;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A100D; --surface:#121A16; --surface-2:#19231E; --line:#24302A;
  --fg:#E6EFE9; --fg-2:#C1CEC6; --muted:#8E9F95;
  --accent:#3DCB8B; --accent-strong:#62DAA3; --accent-ink:#03170D; --accent-soft:#113726;
  --hero:#0E3826; --hero-2:#124631; --hero-ink:#EEFAF2; --hero-muted:#98CBAE; --shuttle:#D8EF5C;
  --debt:#FF8D63; --debt-soft:#3A1D12; --pos:#4ED69A; --pos-soft:#113726;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 0 rgba(255,255,255,.03);
  --focus:#7FB4FF;
  --av1b:#153826;--av1f:#8FE2B7; --av2b:#172E4C;--av2f:#9EC4F4; --av3b:#3A2D0F;--av3f:#F1CD78;
  --av4b:#3D1924;--av4f:#F4A2B9; --av5b:#2A2246;--av5f:#C4B4F4; --av6b:#113434;--av6f:#88DCDC;
  --av7b:#3C2313;--av7f:#F5B389; --av8b:#232E3A;--av8f:#B7C5D5;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.debt{color:var(--debt)} .pos{color:var(--pos)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;border-radius:11px;background:var(--hero);color:var(--hero-ink);
  display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.proto-chip{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}
.view{max-width:560px;margin:0 auto;padding:4px 16px calc(var(--tabbar) + 40px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;height:var(--tabbar);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{background:none;border:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:11px;font-weight:500}
.tab svg{width:23px;height:23px}
.tab span{white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] span{font-weight:700}
.fab-wrap{display:flex;justify-content:center}
.fab{width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 8px 20px rgba(11,122,75,.32)}
.fab svg{width:28px;height:28px}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.1px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.debt{background:var(--debt-soft);color:var(--debt)}
.pill.pos{background:var(--pos-soft);color:var(--pos)}
.pill.neutral{background:var(--surface-2);color:var(--fg-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;
  border-radius:14px;border:1px solid transparent;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.danger{background:transparent;border-color:var(--line);color:var(--debt)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1}
.link{background:none;border:0;padding:0 2px;min-height:40px;display:inline-flex;align-items:center;color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}

.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;flex:none;
  font-weight:700;font-size:calc(var(--s)*.36);letter-spacing:-.3px}
.av.sm{--s:32px} .av.lg{--s:64px} .av.xl{--s:76px}
.av.fund{background:var(--hero);color:var(--hero-ink)}
.av.fund svg{width:60%;height:60%}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:56px;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--line);color:inherit}
.rows>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.main>.t,.main>.s{display:block}
.main>.s.clamp,.main>.t.clamp{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14px;color:var(--fg-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:0 14px;
  font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--fg-2)}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent)}

.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--fg-2)}
.input{width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:16px}
.input::placeholder{color:var(--muted);opacity:.65;font-weight:400}
.money input::placeholder{font-weight:600;opacity:.4}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:200px;resize:vertical;line-height:1.5;font-size:15px}
.money{position:relative}
.money input{font-size:28px;font-weight:700;padding-right:44px;min-height:60px;letter-spacing:-.5px}
.money .unit{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:700;font-size:20px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--debt);font-weight:600}

/* ---------- Home ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:20px;background:var(--hero);color:var(--hero-ink)}
.hero .court{position:absolute;right:-30px;top:-14px;width:200px;height:220px;opacity:.16;pointer-events:none}
.hero>:not(.court){position:relative}
.hero .lbl{font-size:13px;font-weight:600;color:var(--hero-muted)}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin-top:6px}
.hero .big small{font-size:24px;font-weight:700;margin-left:2px;color:var(--hero-muted)}
.hero .hero-cells{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.hero .cell{background:var(--hero-2);border-radius:14px;padding:10px 12px}
.hero .cell small{display:block;font-size:12px;color:var(--hero-muted);font-weight:500}
.hero .cell b{font-size:17px;font-weight:700}
.hero .shuttle-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--shuttle);margin-right:6px;vertical-align:1px}

.sess{display:flex;gap:14px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:0;color:inherit}
.datebox{width:54px;flex:none;border-radius:14px;background:var(--surface-2);text-align:center;padding:7px 0 6px}
.datebox b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.datebox span{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.sess .main{flex:1;min-width:0}
.sess .t{font-weight:700}
.sess .s{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .amt{font-weight:800;font-size:16px;white-space:nowrap}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font)}
.chart .bar{fill:var(--accent-soft)}
.chart .bar.cur{fill:var(--accent)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.bar,.chart .hit:focus+.bar{fill:var(--accent-strong)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .lab{fill:var(--muted);font-size:11px;font-weight:500}
.chart .val{fill:var(--fg);font-size:11.5px;font-weight:700}

/* ---------- History / members ---------- */
.monthh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 0}
.monthh h3{margin:0;font-size:15px;font-weight:700}
.list-card{background:var(--surface);border-radius:var(--r-lg);padding:4px 14px;box-shadow:var(--shadow)}
.list-card .sess{padding:12px 0;border-top:1px solid var(--line)}
.list-card>.sess:first-child{border-top:0}
.depo-ic{width:54px;flex:none;display:grid;place-items:center}
.depo-ic span{width:40px;height:40px;border-radius:12px;background:var(--pos-soft);color:var(--pos);display:grid;place-items:center}
.depo-ic svg{width:20px;height:20px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:42px}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* ---------- Settings ---------- */
.group{display:flex;flex-direction:column;gap:12px}
.group>h2{margin:6px 4px 0;font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.setrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;background:none;border:0;text-align:left;padding:0;color:inherit}
.setrow .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--fg-2)}
.setrow .ic svg{width:19px;height:19px}
.setrow .main{flex:1;min-width:0}
.setrow .t{font-weight:600}
.setrow .s{font-size:13px;color:var(--muted);margin-top:1px}
/* stacked settings rows: same height and padding everywhere, divider starts at the text */
.set-list{display:flex;flex-direction:column}
.card.set-list{padding:4px 16px}
.set-list .setrow{position:relative;padding:12px 0;min-height:68px}
.set-list .setrow+.setrow::before{content:"";position:absolute;top:0;left:48px;right:0;height:1px;background:var(--line)}
.foot-note{font-size:12.5px;color:var(--muted);text-align:center;padding:8px 12px;line-height:1.5}

/* ---------- Layers: sheet, dialog, full screen ---------- */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.layer.anim .scrim{animation:fade .2s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;background:var(--surface);border-radius:24px 24px 0 0;
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.layer.anim .sheet{animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 20px;flex:none}
.sheet-h h2{margin:0;font-size:18px;font-weight:700;flex:1;min-width:0;letter-spacing:-.2px}
.sheet-sub{padding:0 20px 8px;font-size:13.5px;color:var(--muted);margin-top:-6px}
.sheet-b{overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-f{padding:12px 20px 14px;border-top:1px solid var(--line);display:flex;gap:10px;flex:none}
.sheet-f{flex-wrap:wrap}
.sheet-f>.btn{flex:1}
.sheet-f>.err{flex-basis:100%;margin:0}
.layer.center{align-items:center;padding:24px 16px}
.dialog{position:relative;width:100%;max-width:360px;background:var(--surface);border-radius:22px;padding:22px 20px 18px}
.layer.anim .dialog{animation:pop .18s ease}
.dialog h2{margin:0 0 6px;font-size:18px}
.dialog p{margin:0 0 18px;color:var(--fg-2)}
.full{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.full.anim{animation:slide .22s ease}
.full-h{display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:56px;flex:none}
.full-h h2{margin:0;font-size:17px;font-weight:700;flex:1;text-align:center;letter-spacing:-.2px}
.full-h .step{width:44px;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 16px 10px;flex:none}
.progress i{height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)}
.full-b{flex:1;overflow-y:auto;padding:6px 16px 24px}
.full-b-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.full-f{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.full-f-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.full-f-in .btn{flex:1}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h3{margin:0;font-size:15px;font-weight:700}
.sec-h.wrap{flex-wrap:wrap;align-items:center;row-gap:0}
.sec-h.wrap h3{white-space:nowrap}
.acts{display:flex;gap:18px;margin-left:auto}

/* players grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ptile{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--fg-2);min-height:88px}
.ptile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.ptile .tick{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:none;place-items:center}
.ptile .tick svg{width:13px;height:13px}
.ptile[aria-pressed="true"] .tick{display:grid}

/* expense item card */
.item{background:var(--surface);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.item-h{display:flex;align-items:center;gap:8px}
.item-h input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;font-weight:700;padding:6px 0;min-height:44px;border-bottom:1px dashed var(--line);border-radius:0}
.item-h input:focus{outline:none;border-bottom-color:var(--accent)}
.split{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:8px 8px 8px 12px}
.split .main{flex:1;min-width:0;font-size:14px}
.split .main b{font-weight:700}
.add-items{display:flex;flex-direction:column;gap:8px}

/* participants sheet */
.prow{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:6px 0;text-align:left;color:inherit;min-height:52px}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.box svg{width:15px;height:15px;opacity:0}
.pick[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.pick[aria-checked="true"] .box svg{opacity:1}
.pick .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .each{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.x2{min-width:52px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted)}
.x2[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.x2:disabled{opacity:.35}

/* on/off switch (member playing / left) */
.sw{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;min-height:48px;
  background:none;border:0;padding:0;color:var(--muted);font-size:11.5px;font-weight:600}
.sw i{position:relative;width:44px;height:26px;border-radius:13px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{color:var(--accent)}
.sw[aria-checked="true"] i{background:var(--accent)}
.sw[aria-checked="true"] i::after{transform:translateX(18px)}

/* review */
.sum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.tile b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px;margin-top:2px;font-variant-numeric:tabular-nums}
.tile.wide{grid-column:1/-1}
.sheet .tile{background:var(--surface-2);box-shadow:none}

/* category bars in month stats */
.hbar{display:grid;grid-template-columns:72px 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.hbar .trk{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .trk i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}

/* QR */
.qr-card{background:#FFFFFF;border-radius:20px;padding:14px;align-self:center;width:min(260px,100%);border:1px solid var(--line)}
.qr-card img{display:block;width:100%;height:auto;image-rendering:pixelated}
.kv{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .main{flex:1;min-width:0}
.kv small{display:block;font-size:12.5px;color:var(--muted)}
.kv b{font-weight:700;word-break:break-word}

/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom,0px));z-index:70;
  max-width:528px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:4px 6px 4px 16px;
  display:flex;align-items:center;gap:8px;min-height:52px;animation:rise .2s ease;overflow:hidden}
.has-layer .toast{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px));animation:drop .2s ease}
.has-full .toast{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));animation:rise .2s ease}
.toast.err{background:var(--debt);color:#FFFFFF}
.toast .msg{flex:1;font-weight:600;font-size:14px;padding:8px 0}
.toast button{background:none;border:0;color:inherit;font-weight:800;padding:10px 12px;border-radius:10px;text-decoration:underline;text-underline-offset:3px}
.toast .timer{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);animation:timer linear forwards}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:var(--accent);animation:busy 1s ease-in-out infinite;transform-origin:left}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--hero);color:var(--hero-ink);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lock .logo{width:64px;height:64px;border-radius:20px;margin:0 auto;background:var(--hero-2)}
.lock .logo svg{width:42px;height:42px}
.lock h1{margin:0;font-size:22px}
.lock p{margin:0;color:var(--hero-muted);font-size:14px}
.lock .input{background:var(--hero-2);border-color:transparent;color:var(--hero-ink);text-align:center;font-size:18px}
.lock .btn{background:var(--shuttle);color:#16210A}
.lock .lock-link{font-size:14px;text-align:left}
.lock .lock-link::placeholder,.lock .input::placeholder{color:var(--hero-muted);opacity:.8}
.lock-msg{color:var(--shuttle)!important;font-weight:600}
.lock-link-btn{background:none;border:0;color:var(--hero-muted);font-weight:600;font-size:14px;min-height:44px;text-decoration:underline;text-underline-offset:3px}

@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes timer{from{width:100%}to{width:0}}
@keyframes busy{0%{transform:scaleX(.05)}50%{transform:scaleX(.7)}100%{transform:scaleX(.05);transform-origin:right}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
@media (min-width:700px){.view{padding-top:12px}}
.narrow{display:none}
@media (max-width:359px){
  .proto-chip{display:none}
  .wide{display:none} .narrow{display:inline}
  .seg button{padding:0 4px}
  .hero .big{font-size:40px}
  .tab{font-size:10.5px;letter-spacing:-.1px}
}
</style>

<body>
<div id="busy" class="busy" hidden></div>
<header id="top" class="top"></header>
<main id="view" class="view"></main>
<nav id="tabbar" class="tabbar" aria-label="Điều hướng"></nav>
<div id="layers"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="lock" class="lock" hidden></div>
<script>const PWA = true;</script>
<script>
/* Quản lý quỹ Lông thủ — giao diện. Dữ liệu tiền tính bằng nghìn đồng (k). */
'use strict';
const FUND = 'Quỹ';
const APP_NAME = 'Quản lý quỹ Lông thủ';
const BANKS = [
  ['970436', 'Vietcombank'], ['970415', 'VietinBank'], ['970418', 'BIDV'], ['970405', 'Agribank'],
  ['970407', 'Techcombank'], ['970422', 'MB Bank'], ['970416', 'ACB'], ['970432', 'VPBank'],
  ['970423', 'TPBank'], ['970403', 'Sacombank'], ['970441', 'VIB'], ['970437', 'HDBank'],

  ['970431', 'Eximbank'], ['970449', 'LPBank'], ['970428', 'Nam A Bank'], ['970409', 'Bac A Bank'],
  ['970429', 'SCB'], ['970425', 'ABBANK'], ['970427', 'VietABank'], ['970438', 'BaoViet Bank'],
  ['970412', 'PVcomBank'], ['970452', 'KienlongBank'], ['970433', 'VietBank'], ['970419', 'NCB'],
  ['970430', 'PG Bank'], ['970400', 'Saigonbank'], ['970408', 'GPBank'], ['970414', 'OceanBank']
];
const CATS = { san: 'Tiền sân', cau: 'Cầu', nuoc: 'Nước', xe: 'Gửi xe', khac: 'Khác' };
const WD = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const WDS = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

const S = {
  data: null, c: null, tab: 'home', layers: [], busy: 0,
  hist: { month: '', member: '' }, memq: '', memf: 'all',
  wiz: null, toastT: null
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r0 = n => Math.round(n) || 0;
function k(n) { const r = r0(n); return (r < 0 ? '−' : '') + Math.abs(r).toLocaleString('vi-VN') + 'k'; }
function sk(n) { const r = r0(n); return (r > 0 ? '+' : '') + k(r); }
function tone(n) { const r = r0(n); return r < 0 ? 'debt' : r > 0 ? 'pos' : ''; }
function num(v) { const n = parseFloat(String(v ?? '').replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : 0; }
function todayISO() { const d = new Date(); return iso(d); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function dm(s) { const [, m, d] = s.split('-'); return d + '/' + m; }
function dmy(s) { const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; }
function wd(s) { return WD[pd(s).getDay()]; }
function wds(s) { return WDS[pd(s).getDay()]; }
function monthKey(s) { return s.slice(0, 7); }
function monthLabel(key, long) { const [y, m] = key.split('-'); return long ? 'Tháng ' + Number(m) + '/' + y : 'Th' + Number(m); }
function plain(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D'); }
function cat(content) {
  const s = String(content).toLowerCase();
  if (s.includes('sân')) return 'san'; if (s.includes('cầu')) return 'cau';
  if (s.includes('nước')) return 'nuoc'; if (s.includes('xe')) return 'xe'; return 'khac';
}
function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, val); }
  catch (e) { return null; }
}

/* ---------- icons ---------- */
const P = {
  home: '<path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-5.8H9.2v5.8H5A1.5 1.5 0 0 1 3.5 19z"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  users: '<circle cx="9.5" cy="8" r="3.5"/><path d="M3 19.5v-.8A4.7 4.7 0 0 1 7.7 14h3.6a4.7 4.7 0 0 1 4.7 4.7v.8"/><path d="M15.5 4.8a3.3 3.3 0 0 1 0 6.4M18.2 14.3a4.5 4.5 0 0 1 2.8 4.2v1"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  right: '<path d="M9.5 6l6 6-6 6"/>', left: '<path d="M14.5 6l-6 6 6 6"/>', down: '<path d="M6 9.5l6 6 6-6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  wallet: '<rect x="3" y="6" width="18" height="13.5" rx="2.5"/><path d="M3 10h18M16 14.5h1.5"/>',
  share: '<path d="M12 15V4M8 7.5 12 3.5l4 4"/><path d="M5 12.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5.5"/>',
  copy: '<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.5"/><path d="M15.5 5.5V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h.5"/>',
  qr: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2.5v2.5M20 14v.01M14 20h.01M17 17h3v3h-3z"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',
  edit: '<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/>',
  trash: '<path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l1 12.5a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-12.5M9.5 7V4.5h5V7"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  megaphone: '<path d="M4 10.5v3a1 1 0 0 0 1 1h2l8 4.5V5L7 9.5H5a1 1 0 0 0-1 1z"/><path d="M18.5 9a4 4 0 0 1 0 6M8 14.5l1 5h2.5"/>',
  bank: '<path d="M3.5 9.5 12 4l8.5 5.5M5.5 10v7.5M10 10v7.5M14 10v7.5M18.5 10v7.5M3.5 20.5h17"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16.5 6.5l2.5 2.5M14 9l2 2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5v-1A5.5 5.5 0 0 1 10 14h4a5.5 5.5 0 0 1 5.5 5.5v1"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'
};
function ic(n, cls) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (cls ? ' class="' + cls + '"' : '') + '>' + P[n] + '</svg>'; }
const SHUTTLE = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11.2 21.2 7 5.5h18l-4.2 15.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.2 21 12.3 5.8M18.8 21l.9-15.2M16 20.8V5.8M8.4 10.8h15.2M9.8 16h12.4" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="16" cy="24.6" r="4.6" fill="var(--shuttle)"/></svg>';
const COURT = '<svg class="court" viewBox="0 0 200 220" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="10" y="10" width="180" height="200"/><path d="M10 110h180M30 10v200M170 10v200M100 10v70M100 140v70M10 80h180M10 140h180M10 22h180M10 198h180"/></svg>';

/* ---------- data model ---------- */
function compute(d) {
  const mem = {}, order = [];
  d.members.forEach((m, i) => { mem[m.code] = { code: m.code, name: m.name || m.code, active: m.active !== false, idx: i }; order.push(m.code); });
  const ensure = c => { if (!mem[c]) { mem[c] = { code: c, name: c, active: false, idx: order.length }; order.push(c); } };
  const add = (o, c, v) => { o[c] = (o[c] || 0) + v; };
  const partsBy = {};
  d.parts.forEach(([id, c, w]) => { (partsBy[id] = partsBy[id] || []).push([c, Number(w) || 1]); ensure(c); });
  const share = {}, paid = {}, dep = {}, games = {}, shares = {}, byDate = {};
  let fundOut = 0, depTotal = 0;
  d.expenses.forEach(e => {
    const ps = partsBy[e.id] || [];
    const sw = ps.reduce((a, p) => a + p[1], 0);
    const sh = {};
    ps.forEach(([c, w]) => { const v = sw ? e.amount * w / sw : 0; sh[c] = v; add(share, c, v); });
    shares[e.id] = sh;
    if (e.payer === FUND) fundOut += e.amount; else { ensure(e.payer); add(paid, e.payer, e.amount); }
    const s = byDate[e.date] || (byDate[e.date] = { date: e.date, items: [], players: new Set(), total: 0, fundOut: 0 });
    s.items.push(e); ps.forEach(([c]) => s.players.add(c)); s.total += e.amount; if (e.payer === FUND) s.fundOut += e.amount;
  });
  d.deposits.forEach(x => { ensure(x.member); add(dep, x.member, x.amount); depTotal += x.amount; });
  const sessions = Object.values(byDate).sort((a, b) => b.date.localeCompare(a.date));
  sessions.forEach(s => s.players.forEach(c => add(games, c, 1)));
  const bal = {};
  order.forEach(c => { bal[c] = (dep[c] || 0) + (paid[c] || 0) - (share[c] || 0); });
  const months = {};
  const M = key => months[key] || (months[key] = { key, chi: 0, thu: 0, sessions: [], cat: {}, att: {} });
  sessions.forEach(s => {
    const m = M(monthKey(s.date)); m.chi += s.total; m.sessions.push(s);
    s.items.forEach(e => { const c = cat(e.content); m.cat[c] = (m.cat[c] || 0) + e.amount; });
    s.players.forEach(c => add(m.att, c, 1));
  });
  d.deposits.forEach(x => { M(monthKey(x.date)).thu += x.amount; });
  const debtors = order.filter(c => r0(bal[c]) <= -1).sort((a, b) => bal[a] - bal[b]);
  const sugg = {};
  const recent = d.expenses.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 80);
  recent.forEach((e, i) => {
    const c = cat(e.content); const o = sugg[c] || (sugg[c] = {});
    o[e.amount] = (o[e.amount] || 0) + 100 - i;
  });
  Object.keys(sugg).forEach(c => { sugg[c] = Object.entries(sugg[c]).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => Number(x[0])); });
  const sumBal = order.reduce((a, c) => a + bal[c], 0);
  return { mem, order, partsBy, shares, share, paid, dep, games, bal, sessions, byDate, months,
    fund: depTotal - fundOut, depTotal, fundOut, debtors, sugg, sumBal };
}
const nm = c => c === FUND ? FUND : (S.c.mem[c] ? S.c.mem[c].name : c);
function initials(name) {
  const w = String(name).trim().split(/\s+/);
  if (w.length > 1) return (w[0][0] + w[1][0]).toUpperCase();
  const s = w[0] || '?';
  return /^[A-Z0-9]{2,}$/.test(s) ? s.slice(0, 2) : s[0].toUpperCase();
}
function av(c, size) {
  if (c === FUND) return '<span class="av fund ' + (size || '') + '">' + SHUTTLE + '</span>';
  const m = S.c.mem[c] || { name: c, idx: 0 };
  const n = (m.idx % 8) + 1;
  return '<span class="av ' + (size || '') + '" style="background:var(--av' + n + 'b);color:var(--av' + n + 'f)" aria-hidden="true">' + esc(initials(m.name)) + '</span>';
}
function activeCodes() { return S.c.order.filter(c => S.c.mem[c].active); }

/* ---------- backend ---------- */
const IS_APP = typeof PWA !== 'undefined' && PWA;      // bản cài trên điện thoại: gọi Apps Script qua link
const LINK_KEY = 'qlt_api';
function apiLink() { return store(LINK_KEY) || ''; }
function validLink(u) { return /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec$/.test(String(u || '').trim()); }
function api(fn, ...args) {
  S.busy++; renderBusy();
  const done = () => { S.busy--; renderBusy(); };
  return new Promise((res, rej) => {
    const ok = v => { done(); res(v); }, bad = e => { done(); rej(e); };
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](getPin(), ...args);
    } else if (IS_APP) {
      callLink(fn, [getPin(), ...args]).then(ok, bad);
    } else {
      setTimeout(() => { try { ok(Mock[fn](...args)); } catch (e) { bad(e); } }, 260);
    }
  });
}
async function callLink(fn, args) {
  const url = apiLink();
  if (!validLink(url)) throw new Error('[LINK] Chưa có link kết nối Google Sheet.');
  let r;
  try {
    r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
  } catch (e) {
    if (navigator.onLine === false) throw new Error('[NET] Điện thoại đang mất mạng. Kiểm tra kết nối rồi thử lại.');
    throw new Error('[NET] Không kết nối được Google Sheet. Kiểm tra link kết nối, hoặc thử lại sau ít phút.');
  }
  const text = await r.text();
  let j;
  try { j = JSON.parse(text); } catch (e) { throw new Error('[LINK] Link kết nối chưa đúng, hoặc Apps Script chưa đặt quyền truy cập "Bất kỳ ai".'); }
  if (!j.ok) throw new Error(j.e || 'Có lỗi xảy ra.');

}
function errText(e) { return String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '').replace(/^\[(PIN|LINK|NET)\] /, ''); }
function isPinErr(e) { return String((e && e.message) || e).indexOf('[PIN]') >= 0; }
function isLinkErr(e) { return String((e && e.message) || e).indexOf('[LINK]') >= 0; }
async function call(fn, args, ok) {
  if (S.writing) { toast('Đang lưu, chờ chút…'); return null; }
  S.writing = true;
  try {
    const d = await api(fn, ...(args || []));
    setData(d);

}

function itemSummary(items) {

  items.forEach(e => { const t = String(e.content).trim(); if (!n[t]) order.push(t); n[t] = (n[t] || 0) + 1; });
  return order.map(t => t + (n[t] > 1 ? ' ×' + n[t] : '')).join(' · ');

function sessShare(s, code) { return s.items.reduce((a, e) => a + (S.c.shares[e.id][code] || 0), 0); }
function lastMonths(n) {
  const out = [], d = pd(todayISO()); d.setDate(1);
  for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(iso(x).slice(0, 7)); }

}
function chart6() {
  const keys = lastMonths(6), vals = keys.map(k2 => (S.c.months[k2] || { chi: 0 }).chi);
  const max = Math.max(...vals, 1), W = 320, H = 168, top = 22, base = 136, bw = 30;
  const step = (W - 20) / keys.length;
  const nice = (() => { const raw = max / 2; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; })();
  const ymax = Math.max(nice * 2, max);
  const y = v => base - (base - top) * v / ymax;
  let g = '<line class="grid" x1="10" x2="' + (W - 10) + '" y1="' + y(nice) + '" y2="' + y(nice) + '"/>' +
    '<text class="lab" x="10" y="' + (y(nice) - 5) + '">' + k(nice) + '</text>' +
    '<line class="axis" x1="10" x2="' + (W - 10) + '" y1="' + base + '" y2="' + base + '"/>';
  keys.forEach((key, i) => {
    const cx = 10 + step * i + step / 2, v = vals[i], yy = y(v), h = base - yy, cur = i === keys.length - 1;
    const r = Math.min(4, h / 2);
    const path = h > 0 ? 'M' + (cx - bw / 2) + ',' + base + 'V' + (yy + r) + 'Q' + (cx - bw / 2) + ',' + yy + ' ' + (cx - bw / 2 + r) + ',' + yy +
      'H' + (cx + bw / 2 - r) + 'Q' + (cx + bw / 2) + ',' + yy + ' ' + (cx + bw / 2) + ',' + (yy + r) + 'V' + base + 'Z' : '';
    g += '<g><rect class="hit" x="' + (cx - step / 2) + '" y="' + top + '" width="' + step + '" height="' + (H - top) + '" data-act="month" data-month="' + key + '" tabindex="0" role="button" aria-label="' + monthLabel(key, true) + ': chi ' + k(v) + '"><title>' + monthLabel(key, true) + ': ' + k(v) + '</title></rect>' +
      (path ? '<path class="bar' + (cur ? ' cur' : '') + '" d="' + path + '" pointer-events="none"/>' : '') + '</g>' +
      '<text class="lab" x="' + cx + '" y="' + (base + 18) + '" text-anchor="middle">' + monthLabel(key) + '</text>' +
      (v > 0 && (cur || v === max) ? '<text class="val num" x="' + cx + '" y="' + (yy - 6) + '" text-anchor="middle">' + k(v) + '</text>' : '');
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Chi tiêu 6 tháng gần nhất">' + g + '</svg>';
}

function drawLayers(keepScroll) {

    if (l.kind === 'dialog') return '<div class="layer center' + an + '" data-li="' + i + '"><div class="scrim" data-act="dismiss"></div><div class="dialog" role="alertdialog" aria-modal="true">' + body + '</div></div>';
    return '<div class="layer' + an + '" data-li="' + i + '"><div class="scrim" data-act="dismiss"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(l.title()) + '">' +

  }).join('');

      const first = opts.first || [];

async function shareText(text) {
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  await copyText(text, 'Đã sao chép tin nhắn. Dán vào nhóm Zalo hoặc Messenger nhé.');
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg || 'Đã sao chép'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove(); toast(ok ? (msg || 'Đã sao chép') : 'Không sao chép được, hãy chọn và sao chép thủ công.', ok ? null : { err: true });
  }
}

/* ---------- VietQR ---------- */
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function vietqr(bin, acct, amountVND, info) {
  const m38 = tlv('00', 'A000000727') + tlv('01', tlv('00', bin) + tlv('01', acct)) + tlv('02', 'QRIBFTTA');
  const p = tlv('00', '01') + tlv('01', amountVND ? '12' : '11') + tlv('38', m38) + tlv('53', '704') +
    (amountVND ? tlv('54', String(amountVND)) : '') + tlv('58', 'VN') + (info ? tlv('62', tlv('08', info)) : '') + '6304';
  return p + crc16(p);
}
function qrImg(text) {
  if (typeof qrcode === 'undefined') return '<div class="empty"><b>Chưa tải được thư viện mã QR</b>Kiểm tra kết nối mạng rồi mở lại.</div>';
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return '<img alt="Mã QR chuyển khoản" src="' + q.createDataURL(6, 2) + '">';
}
function openQR(code) {
  const st = { amount: String(Math.max(0, -r0(S.c.bal[code] || 0)) || '') };
  sheet({
    title: () => 'Mã QR chuyển khoản', st,
    sub: () => 'Đưa cho ' + esc(nm(code)) + ' quét bằng app ngân hàng.',
    body: () => {
      const b = S.data.settings && S.data.settings.bank;
      if (!b) return '<div class="empty"><b>Chưa có tài khoản nhận quỹ</b>Nhập ngân hàng và số tài khoản của bạn để tạo mã QR.</div><button class="btn primary block" data-act="bank">' + ic('bank') + 'Nhập tài khoản</button>';
      const amt = Math.round(num(st.amount)), note = transferNote(code);
      const payload = vietqr(b.bin, b.acct, amt > 0 ? amt * 1000 : 0, note);
      const bank = (BANKS.find(x => x[0] === b.bin) || [0, 'Mã ' + b.bin])[1];
      return '<div class="field"><label for="qrAmt">Số tiền</label><div class="money"><input id="qrAmt" class="input num" inputmode="decimal" value="' + esc(st.amount) + '" data-bind="qrAmt" placeholder="0" autocomplete="off"><span class="unit">k</span></div><span class="hint">Để trống nếu muốn người chuyển tự nhập số tiền.</span></div>' +
        '<div class="qr-card" data-qr>' + qrImg(payload) + '</div>' +
        '<div class="rows">' +
        '<div class="kv"><span class="main"><small>Ngân hàng</small><b>' + esc(bank) + '</b></span></div>' +
        '<div class="kv"><span class="main"><small>Số tài khoản</small><b class="num">' + esc(b.acct) + '</b></span><button class="btn ghost sm" data-act="copy" data-text="' + esc(b.acct) + '">' + ic('copy') + 'Chép</button></div>' +
        (b.holder ? '<div class="kv"><span class="main"><small>Chủ tài khoản</small><b>' + esc(b.holder) + '</b></span></div>' : '') +
        '<div class="kv"><span class="main"><small>Nội dung</small><b>' + esc(note).replace(/-/g, '\u2011') + '</b></span><button class="btn ghost sm" data-act="copy" data-text="' + esc(note) + '">' + ic('copy') + 'Chép</button></div></div>' +
        (note.length > 25 ? '<span class="hint">Nội dung dài ' + note.length + ' ký tự; một số app ngân hàng có thể cắt bớt phần cuối.</span>' : '');
    }
  });
}

function wizTotals() {

    ps.forEach(([c, wt]) => { per[c] = per[c] || { total: 0, by: [] }; const v = sw ? a * wt / sw : 0; per[c].total += v; per[c].by.push([it.content, v]); });
  });

function wizProblem() {

    l.innerHTML = '<form id="retryForm"><span class="logo">' + SHUTTLE + '</span><h1>' + APP_NAME + '</h1>' +
      '<p class="lock-msg" role="alert">' + esc(msg) + '</p><button class="btn block" type="button" data-act="retryBoot">Thử lại</button></form>';
    return;
  }
  l.innerHTML = '<form id="lockForm" novalidate><span class="logo">' + SHUTTLE + '</span><h1>' + APP_NAME + '</h1>' +
    '<p>' + (typeof PROTOTYPE !== 'undefined' && PROTOTYPE ? 'Bản mẫu: nhập mã bất kỳ để mở.' : askLink ? 'Dán link kết nối Google Sheet và nhập mã truy cập.' : 'Nhập mã truy cập để mở app.') + '</p>' +
    (askLink ? '<label class="sr" for="linkIn">Link kết nối (Apps Script)</label><input id="linkIn" class="input lock-link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(apiLink()) + '">' : '') +
    '<label class="sr" for="lockIn">Mã truy cập</label><input id="lockIn" class="input" type="password" autocomplete="current-password" maxlength="64" placeholder="Mã truy cập">' +
    (msg ? '<p class="lock-msg" role="alert">' + esc(msg) + '</p>' : '') + '<button class="btn block" type="submit">Mở</button>' +
    (IS_APP && !askLink ? '<button class="lock-link-btn" type="button" data-act="relink">Đổi link kết nối</button>' : '') + '</form>';
  setTimeout(() => { const i = $(askLink && !validLink(apiLink()) ? 'linkIn' : 'lockIn'); if (i) i.focus(); }, 60);

document.addEventListener('submit', e => {

  },
  /* deposit form */
  depPick: () => { const st = topLayer().st; picker({ title: 'Ai nộp tiền?', cur: st.member, all: false, first: S.c.debtors.filter(c => S.c.mem[c].active),
    sub: c => r0(S.c.bal[c]) <= -1 ? 'Đang nợ ' + k(-S.c.bal[c]) : 'Số dư ' + sk(S.c.bal[c]), onPick: c => { st.member = c; refreshLayers(); } }); },
  depQuick: el => { topLayer().st.amount = el.dataset.v; refreshLayers(); },
  depSave: async () => {
    const st = topLayer().st, a = num(st.amount);
    const res = await call('addDeposit', [{ date: st.date, member: st.member, amount: a, note: st.note.trim() }], nm(st.member) + ' ' + (a < 0 ? 'rút ' : 'nộp ') + k(Math.abs(a)));
    if (res) closeAll();
  },
  /* remind */
  remToggle: el => { const st = topLayer().st, c = el.dataset.code; st.sel.has(c) ? st.sel.delete(c) : st.sel.add(c); st.text = null; refreshLayers(); },
  remReset: () => { topLayer().st.text = null; refreshLayers(); },
  remCopy: () => copyText($('remTxt').value, 'Đã sao chép tin nhắn'),
  remShare: () => shareText($('remTxt').value),
  /* bank */
  bankSave: async () => {
    const st = topLayer().st, bin = st.bin === 'other' ? st.other.trim() : st.bin, acct = st.acct.replace(/\s+/g, '');
    if (!/^\d{6}$/.test(bin)) return toast('Chọn ngân hàng (hoặc nhập mã 6 số).', { err: true });
    if (!/^[0-9A-Za-z]{4,19}$/.test(acct)) return toast('Số tài khoản không hợp lệ.', { err: true });
    const holder = plain(st.holder).toUpperCase().replace(/[^A-Z ]/g, '').replace(/\s+/g, ' ').trim();
    if (await call('saveBank', [{ bin, acct, holder }], 'Đã lưu tài khoản nhận quỹ')) popLayer();
  },
  /* members */
  toggleActive: el => { const m = S.c.mem[el.dataset.code]; call('saveMember', [{ code: m.code, name: m.name, active: !m.active }], (m.active ? 'Đã chuyển ' : 'Đã đưa ') + m.name + (m.active ? ' sang đã nghỉ' : ' trở lại')); },
  addStart: () => { topLayer().st.adding = true; refreshLayers(); },
  addCancel: () => { Object.assign(topLayer().st, { adding: false, code: '', name: '' }); refreshLayers(); },
  addSave: async () => {
    const st = topLayer().st, code = st.code.trim(), name = st.name.trim() || code;
    if (!code) return toast('Nhập mã thành viên.', { err: true });
    if (await call('saveMember', [{ code, name, active: true, isNew: true }], 'Đã thêm ' + name)) Object.assign(st, { adding: false, code: '', name: '' }), refreshLayers();
  },
  pinSave: async () => {
    const st = topLayer().st;
    if (st.b.trim().length < 4 || st.b.trim().length > 64) { st.err = 'Mã mới phải dài 4–64 ký tự.'; st.errAt = 1; return refreshLayers(); }
    if (st.b !== st.c) { st.err = 'Hai lần nhập mã mới không khớp.'; st.errAt = 2; return refreshLayers(); }
    try { await api('changePin', st.a, st.b.trim()); setPin(st.b.trim()); popLayer(); toast('Đã đổi mã truy cập'); }
    catch (e) { st.err = errText(e); st.errAt = 0; refreshLayers(); }
  },
  /* wizard */
  wClose: async () => {
    const w = S.wiz;
    const dirty = w.dirty || w.mode === 'edit';
    if (dirty && !(await confirmBox('Bỏ thay đổi?', 'Những gì bạn vừa nhập cho buổi này sẽ không được lưu.', 'Bỏ', true))) return;
    S.wiz = null; closeAll();
  },
  wBack: () => { S.wiz.step--; refreshLayers(); scrollWizTop(); },
  wNext: () => { const w = S.wiz; if (wizProblem()) return; if (w.step < 3) { w.step++; refreshLayers(); scrollWizTop(); } else wizSave(); },
  wDate: el => { S.wiz.date = el.dataset.d; S.wiz.dirty = true; refreshLayers(); },
  wPlayer: el => {
    const w = S.wiz, c = el.dataset.code;
    if (w.players.has(c)) { w.players.delete(c); w.items.forEach(it => { if (it.custom) delete it.custom[c]; }); }
    else { w.players.add(c); w.items.forEach(it => { if (it.custom) it.custom[c] = 1; }); }
    w.dirty = true; refreshLayers();
  },
  wLast: () => { const w = S.wiz, last = S.c.sessions[0]; w.players = new Set([...last.players]); w.items.forEach(it => it.custom = null); w.dirty = true; refreshLayers(); },
  wNone: () => { const w = S.wiz; w.players = new Set(); w.items.forEach(it => it.custom = null); refreshLayers(); },
  wShowOff: () => { S.wiz.showOff = true; refreshLayers(); },
  wSugg: el => { const it = wItem(el.dataset.key); it.amount = el.dataset.v; S.wiz.dirty = true; refreshLayers(); },
  wDelItem: el => { const w = S.wiz; w.items = w.items.filter(i => i.key !== Number(el.dataset.key)); w.dirty = true; refreshLayers(); },
  wAdd: el => {
    const w = S.wiz, it = newItem(el.dataset.n || '');
    w.items.push(it); w.dirty = true; refreshLayers();
    setTimeout(() => { const i = $(el.dataset.n ? 'ia_' + it.key : 'in_' + it.key); if (i) { i.focus(); i.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }, 30);
  },
  wPayFund: el => { wItem(el.dataset.key).payer = FUND; refreshLayers(); },
  wPayMem: el => { const it = wItem(el.dataset.key); picker({ title: 'Ai trả hộ "' + it.content + '"?', cur: it.payer, first: [...S.wiz.players], onPick: c => { it.payer = c; S.wiz.dirty = true; refreshLayers(); } }); },
  wSplit: el => openSplit(el.dataset.key),
  spToggle: el => { const it = splitItem(), c = el.dataset.code; it.custom[c] = it.custom[c] ? 0 : 1; if (!it.custom[c]) delete it.custom[c]; refreshLayers(); },
  spX2: el => { const it = splitItem(), c = el.dataset.code; it.custom[c] = it.custom[c] === 2 ? 1 : 2; refreshLayers(); },
  spAll: () => { const it = splitItem(); it.custom = {}; S.wiz.players.forEach(c => it.custom[c] = 1); refreshLayers(); },
  spNone: () => { splitItem().custom = {}; refreshLayers(); },
  spOthers: () => { topLayer().st.showOthers = true; refreshLayers(); }
};
function splitItem() { return wItem(topLayer().itemKey); }
function scrollWizTop() { const b = document.querySelector('.full-b'); if (b) b.scrollTop = 0; }

/* text inputs: update state without re-rendering the field being typed in */
const BIND = {
  memq: v => { S.memq = v; const pos = $('memq').selectionStart; render(); const i = $('memq'); i.focus(); i.setSelectionRange(pos, pos); },
  pickq: v => { topLayer().st.q = v; const pos = $('pickq').selectionStart; refreshLayers(); const i = $('pickq'); i.focus(); i.setSelectionRange(pos, pos); },
  depAmt: v => { topLayer().st.amount = v; updateFoot(); },
  depDate: v => { topLayer().st.date = v; },
  depNote: v => { topLayer().st.note = v; },
  remTxt: v => { topLayer().st.text = v; },
  qrAmt: v => { topLayer().st.amount = v; clearTimeout(S.qrT); S.qrT = setTimeout(refreshLayers, 350); },
  bkBin: v => { topLayer().st.bin = v; refreshLayers(); },
  bkOther: v => { topLayer().st.other = v; }, bkAcct: v => { topLayer().st.acct = v; }, bkHolder: v => { topLayer().st.holder = v; },
  nmCode: v => { topLayer().st.code = v; }, nmName: v => { topLayer().st.name = v; },
  pin0: v => { topLayer().st.a = v; }, pin1: v => { topLayer().st.b = v; }, pin2: v => { topLayer().st.c = v; },
  wDate: v => { if (v) { S.wiz.date = v; S.wiz.dirty = true; refreshWizFoot(); } },
  itName: (v, el) => { wItem(el.dataset.key).content = v; S.wiz.dirty = true; refreshWizFoot(); },
  itAmt: (v, el) => { wItem(el.dataset.key).amount = v; S.wiz.dirty = true; refreshWizFoot(); }
};
function updateFoot() { const l = topLayer(); const f = document.querySelector('[data-li="' + (S.layers.length - 1) + '"] .sheet-f'); if (f && l.foot) f.innerHTML = l.foot(); }
function refreshWizFoot() {
  const host = document.querySelector('.full'); if (!host) return;
  const tmp = document.createElement('div'); tmp.innerHTML = wizBody();
  host.querySelector('.full-f').replaceWith(tmp.querySelector('.full-f'));
  const w = S.wiz;
  if (w.step === 2) host.querySelectorAll('.item').forEach(card => {
    const it = wItem(card.dataset.key); if (!it) return;
    card.querySelectorAll('[data-act="wSugg"]').forEach(b => b.setAttribute('aria-pressed', String(num(it.amount) === Number(b.dataset.v))));
  });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('rect[data-act]')) { e.preventDefault(); A[e.target.dataset.act](e.target); }
  if (e.key === 'Escape' && S.layers.length) { const l = topLayer(); if (l.wiz) A.wClose(); else popLayer(); }
});
document.addEventListener('input', e => { const b = e.target.dataset && e.target.dataset.bind; if (b && BIND[b]) BIND[b](e.target.value, e.target); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.actChange === 'rename') {
    const m = S.c.mem[t.dataset.code], v = t.value.trim();
    if (v && v !== m.name) call('saveMember', [{ code: m.code, name: v, active: m.active }], 'Đã đổi tên thành ' + v);
  }
  if (t.dataset && t.dataset.bind === 'wDate') refreshLayers();
});

/* reload when the app comes back after a while (the sheet may have been edited elsewhere) */
let hiddenAt = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!hiddenAt || Date.now() - hiddenAt < 30000) return;
  hiddenAt = 0;
  if (!S.data || S.layers.length || S.writing || !$('lock').hidden) return;
  try { setData(await api('getData')); }
  catch (e) { if (isPinErr(e)) { setPin(''); showLock(errText(e)); } }
});

/* ---------- start ---------- */
async function boot() {
  try { setData(await api('getData')); }
  catch (e) {
    if (isPinErr(e)) { setPin(''); showLock(errText(e)); }
    else if (isLinkErr(e)) showLock(errText(e), { link: true });
    else if (IS_APP && !S.data) showLock(errText(e), { retry: true });
    else toast('Không tải được dữ liệu: ' + errText(e), { err: true });
  }
}
/* có mạng lại khi đang ở màn hình báo mất mạng: tự tải lại */
window.addEventListener('online', () => { if (!S.data && $('retryForm') && !$('lock').hidden) A.retryBoot(); });
/* installed app: remember Chrome's install prompt so Settings can offer "Cài app" */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.tab === 'settings' && S.data) render(); });
window.addEventListener('appinstalled', () => { S.installEvt = null; if (S.data) { render(); toast('Đã cài app vào điện thoại'); } });
/* a setup link can carry the Apps Script link: …/#api=<link> */
(function readSetupLink() {
  const m = /[#&]api=([^&]+)/.exec(location.hash || '');
  if (!m) return;
  try { const u = decodeURIComponent(m[1]); if (validLink(u)) store(LINK_KEY, u); } catch (e) { /* bỏ qua */ }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* bỏ qua */ }
})();
applyTheme();
if (typeof PROTOTYPE !== 'undefined' && PROTOTYPE) boot();
else if (!getPin()) showLock(); else boot();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
